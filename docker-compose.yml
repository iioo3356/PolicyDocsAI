services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: policy_docs
      POSTGRES_USER: policy
      POSTGRES_PASSWORD: policy
    ports:
      - "5432:5432"
    volumes:
      - policy_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policy -d policy_docs"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://policy:policy@db:5432/policy_docs
      STORAGE_PATH: /data/storage
      WEB_ORIGIN: http://localhost:3000
      LLM_API_KEY: ${LLM_API_KEY:-${GEMINI_API_KEY:-}}
      LLM_MODEL: ${LLM_MODEL:-${GEMINI_MODEL:-gemini/gemini-3.1-flash-lite}}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-${GEMINI_TIMEOUT_SECONDS:-45}}
      LLM_MIN_INTERVAL_SECONDS: ${LLM_MIN_INTERVAL_SECONDS:-13}
    ports:
      - "8000:8000"
    volumes:
      - policy_storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  policy_db:
  policy_storage:
